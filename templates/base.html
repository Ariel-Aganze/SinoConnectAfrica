<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_settings.site_name }}{% endblock %}</title>
    
    <!-- Google Fonts : Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0F2D52',
                        action: '#1FA774',
                        light: '#F5F7FA',
                        danger: '#D64545',
                        white: '#FFFFFF',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.04)',
                        'card': '0 2px 10px rgba(0,0,0,0.02)',
                    }
                }
            }
        }
    </script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="font-sans bg-white text-gray-800 antialiased">
    
    {% block header %}
        {% include 'includes/public_header.html' %}
    {% endblock %}
    
    {% block content %}{% endblock %}
    
    {% block footer %}
        {% include 'includes/public_footer.html' %}
    {% endblock %}
    
    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/{{ site_settings.whatsapp_number }}?text=Bonjour,%20je%20souhaite%20plus%20d'informations%20sur%20vos%20services." 
       target="_blank" 
       class="fixed bottom-6 right-6 bg-[#25D366] text-white w-14 h-14 rounded-full shadow-lg hover:shadow-2xl hover:scale-105 transition-all flex items-center justify-center text-3xl z-50">
        <i class="fab fa-whatsapp"></i>
    </a>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
